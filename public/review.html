<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supplier ↔ Gastronom match review</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --ok: #3fb950;
      --warn: #d4a72c;
      --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, Segoe UI, Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid #2d3a4f;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
    header .meta { font-size: 0.85rem; color: var(--muted); }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #3d4f6f;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { border-color: var(--bad); color: var(--bad); }
    button.success { border-color: var(--ok); color: var(--ok); }
    #filter-no-match { color: #fff; }
    main { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .nav-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid #2d3a4f;
    }
    .panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
    .supplier-img, .match-img {
      width: 100%;
      max-height: 150px;
      object-fit: contain;
      background: #0f1419;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .line { margin: 6px 0; font-size: 0.95rem; }
    .line strong { color: var(--muted); font-weight: 500; display: inline-block; min-width: 90px; }
    .desc-line {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 1.35em; /* keep supplier card height stable */
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .st-confirmed { background: #1f3d2a; color: var(--ok); }

    .st-review { background: #3d3420; color: var(--warn); }
    .st-none { background: #3d2020; color: var(--bad); }
    .match-card {
      border: 1px solid #2d3a4f;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .match-card:hover { border-color: var(--accent); }
    .match-card.selected { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
    .score { font-size: 0.85rem; color: var(--accent); }
    .price-diff { font-size: 0.8rem; margin-top: 4px; }
    .price-diff.warn { color: var(--warn); }
    .price-diff.ok { color: var(--muted); }
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: 12px;
      padding: 20px;
      max-width: 520px;
      width: 100%;
      max-height: 85vh;
      overflow: auto;
      border: 1px solid #2d3a4f;
    }
    .modal input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #3d4f6f; background: var(--bg); color: var(--text); }
    .search-hit { padding: 10px; border-bottom: 1px solid #2d3a4f; cursor: pointer; }
    .search-hit:hover { background: #243044; }
    footer a { color: var(--accent); }
    .modal.wide { max-width: min(1040px, 96vw); }
    .unpaired-summary {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .unpaired-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .unpaired-card {
      background: var(--bg);
      border: 1px solid #2d3a4f;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .unpaired-img-link {
      display: block;
      border-radius: 6px;
      overflow: hidden;
      line-height: 0;
      background: #0a0e14;
    }
    .unpaired-img-link:hover { opacity: 0.92; }
    .unpaired-img-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .unpaired-img-link.unpaired-img-fallback {
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      color: var(--accent);
      font-size: 0.85rem;
    }
    .unpaired-card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #0a0e14;
      border-radius: 6px;
      display: block;
    }
    .unpaired-card .title {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.35;
    }
    .unpaired-card .handle {
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-all;
    }
    .st-active { background: #1f3d2a; color: var(--ok); }
    .st-draft { background: #3d3420; color: var(--warn); }
    .st-other { background: #2a3140; color: var(--muted); }
    #mapping-warn {
      display: none;
      margin: 0 20px 12px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--bad);
      background: #3d2020;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    #mapping-warn code { font-size: 0.85em; }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
    }
    .modal-head h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      flex: 1;
      min-width: 0;
    }
    button.modal-close {
      flex-shrink: 0;
      margin: 0;
      padding: 6px 12px;
    }
    .variants {
      margin-top: 10px;
      border-top: 1px solid #2d3a4f;
      padding-top: 10px;
    }
    .variants .vtitle {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .variants table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .variants th, .variants td {
      text-align: left;
      padding: 6px 6px;
      border-bottom: 1px solid #2d3a4f;
      vertical-align: top;
    }
    .variants th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
    }
    .qty-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid #3d4f6f;
      background: var(--bg);
      color: var(--muted);
      white-space: nowrap;
    }
    .qty-pill.ok { border-color: var(--ok); color: var(--ok); }
    .qty-pill.warn { border-color: var(--warn); color: var(--warn); }
    .qty-pill.bad { border-color: var(--bad); color: var(--bad); }
    .qty-btn {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 999px;
      border: 1px solid #3d4f6f;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .qty-btn:hover { border-color: var(--accent); }
    .qty-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .ps-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-left: 6px;
      border: 1px solid #3d4f6f;
      background: var(--bg);
      color: var(--muted);
      vertical-align: middle;
    }
    .ps-active { border-color: var(--ok); color: var(--ok); }
    .ps-draft { border-color: var(--warn); color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <h1 id="hdr-title">Supplier ↔ Gastronom</h1>
    <button type="button" id="btn-unpaired-gastronom" onclick="showUnpairedGastronom()">Gastronom: not on supplier</button>
    <button type="button" id="btn-unpaired-supplier" onclick="showUnpairedSupplier()">1-caviar: not in Gastronom</button>
    <button type="button" id="btn-supplier-delta" onclick="window.location.href='/supplier-delta'">Supplier delta</button>
    <button type="button" id="btn-sync-gastronom" title="Same as npm run sync:gastronom — refreshes Output/from_gastronom.json from Shopify" onclick="fetchGastronomFromShopify(this)">Fetch Gastronom from Shopify</button>
    <button type="button" id="btn-run-automation" class="primary" title="Runs: sync Gastronom → supplier scan+snapshot+publish → draft unpaired ACTIVE → sync mapped updates" onclick="runDailyAutomation(this)">Run daily automation</button>
  </header>
  <main>
    <div id="mapping-warn"></div>
    <div class="nav-row">
      <button type="button" onclick="prev()">← Previous</button>
      <button type="button" onclick="next()">Next →</button>
      <span style="flex:1 1 auto;"></span>
      <button type="button" id="filter-no-match" class="danger" onclick="setFilter('no_match')">❌ No match</button>
      <button type="button" id="filter-needs-review" onclick="setFilter('needs_review')">⚠️ Needs review</button>
      <button type="button" id="filter-confirmed" class="success" onclick="setFilter('confirmed')">✅ Confirmed</button>
      <button type="button" id="filter-all" onclick="setFilter('all')">All</button>
      <span id="idx-label" class="meta"></span>
    </div>
    <div id="status-bar"></div>
    <div class="grid">
      <div class="panel">
        <h2 id="supplier-panel-title">Supplier (1-caviar) <span id="supplier-card-status"></span></h2>
        <div id="supplier-block"></div>
      </div>
      <div class="panel">
        <h2>Gastronom suggestions</h2>
        <div id="matches-block"></div>
        <div style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" class="success" onclick="confirmSelected()">✅ Confirm match</button>
          <button type="button" class="danger" onclick="markNoMatch()">❌ No match</button>
          <button type="button" onclick="openSearch()">🔍 Search manually</button>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-bg" id="search-modal">
    <div class="modal">
      <h2 style="margin-top:0;font-size:1rem;">Search Gastronom catalog</h2>
      <input type="search" id="search-input" placeholder="Name or handle…" />
      <div id="search-results"></div>
      <button type="button" onclick="closeSearch()" style="margin-top:12px;">Close</button>
    </div>
  </div>

  <div class="modal-bg" id="unpaired-modal">
    <div class="modal wide">
      <div class="modal-head">
        <h2>Gastronom products not paired with supplier</h2>
        <button type="button" class="modal-close" onclick="closeUnpaired()">Close</button>
      </div>
      <p class="unpaired-summary" id="unpaired-summary"></p>
      <div id="unpaired-actions" class="nav-row" style="display: none; margin-bottom: 8px;">
        <button type="button" class="danger" id="btn-unpaired-draft-all" onclick="draftAllUnpairedActive(this)">
          Set all ACTIVE unpaired → DRAFT in Shopify
        </button>
      </div>
      <div class="unpaired-grid" id="unpaired-grid"></div>
    </div>
  </div>

  <div class="modal-bg" id="supplier-unpaired-modal">
    <div class="modal wide">
      <div class="modal-head">
        <h2>1-caviar.ae products not linked to Gastronom export</h2>
        <button type="button" class="modal-close" onclick="closeSupplierUnpaired()">Close</button>
      </div>
      <p class="unpaired-summary" id="supplier-unpaired-summary"></p>
      <div class="unpaired-grid" id="supplier-unpaired-grid"></div>
    </div>
  </div>

  <div class="modal-bg" id="automation-modal">
    <div class="modal wide">
      <div class="modal-head">
        <h2>Automation report</h2>
        <button type="button" class="modal-close" onclick="document.getElementById('automation-modal').classList.remove('open')">Close</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
        <button type="button" onclick="loadLastAutomationReport()">Refresh report</button>
        <a class="meta" id="automation-report-table-link" href="/automation-report" target="_blank" rel="noopener noreferrer">Open table view</a>
        <a class="meta" id="automation-report-json-link" href="/api/automation/last-run" target="_blank" rel="noopener noreferrer">Open as JSON</a>
      </div>
      <pre id="automation-log" style="font-size:12px; overflow:auto; max-height:65vh; white-space:pre-wrap;"></pre>
    </div>
  </div>

  <script>
    const REVIEW_PORT = '3001';
    const modeParam = new URLSearchParams(location.search).get('mode');
    const MODE = modeParam === 'ubazar' ? 'ubazar' : 'default';
    try {
      const stored = localStorage.getItem('match_mode');
      if (!modeParam && stored === 'ubazar') {
        // Prevent accidental drop back to caviar mode when user opens "/" directly.
        location.replace(location.pathname + '?mode=ubazar');
      } else {
        localStorage.setItem('match_mode', MODE);
      }
    } catch (_) {
      // ignore
    }
    /** When the page is opened from Live Server or another port, API still targets the review server. */
    function apiOrigin() {
      if (location.port === REVIEW_PORT) return '';
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        return `${location.protocol}//${location.hostname}:${REVIEW_PORT}`;
      }
      return '';
    }
    const API = apiOrigin();
    const ENDPOINTS = MODE === 'ubazar'
      ? {
          report: '/api/ubazar/report',
          confirm: '/api/ubazar/confirm',
          noMatch: '/api/ubazar/no-match',
          search: '/api/gastronom/uzbek-search'
        }
      : {
          report: '/api/report',
          confirm: '/api/confirm',
          noMatch: '/api/no-match',
          search: '/api/search'
        };

    /** @type {'no_match'|'needs_review'|'confirmed'|'all'} */
    let filterMode = MODE === 'ubazar' ? 'needs_review' : 'no_match';
    /** Unfiltered report rows from /api/report */
    let rowsAll = [];
    let rows = [];
    let idx = 0;
    let selectedShopifyId = null;
    let selectedRowSuggestionIndex = null;
    /** Picked from manual search; confirm on main screen */
    let manualPick = null;
    let lastSearchHits = [];
    let inventoryFlashTimer = null;
    /** ACTIVE count from last Gastronom-unpaired modal load (for bulk draft confirm). */
    let lastUnpairedActiveCount = 0;

    function badgeClass(st) {
      if (st.includes('confirmed')) return 'st-confirmed';
      if (st.includes('no match')) return 'st-none';
      if (st.includes('auto by handle')) return 'st-confirmed';
      return 'st-review';
    }

    function restoreStatusBarFromRow() {
      const bar = document.getElementById('status-bar');
      if (!bar) return;
      bar.innerHTML = '';
    }

    /** Non-blocking message in the status strip (no alert/confirm). */
    function showInventoryFlash(message, isError) {
      const bar = document.getElementById('status-bar');
      if (!bar) return;
      bar.innerHTML = `<span class="status-badge ${isError ? 'st-none' : 'st-confirmed'}">${escapeHtml(message)}</span>`;
      if (inventoryFlashTimer) clearTimeout(inventoryFlashTimer);
      inventoryFlashTimer = setTimeout(() => {
        inventoryFlashTimer = null;
        restoreStatusBarFromRow();
      }, 5000);
    }

    function applyFilter() {
      const list = rowsAll || [];
      const isNoMatch = (r) => String(r?.status || '').includes('no match');
      const isNeedsReview = (r) => String(r?.status || '').includes('needs review');
      const isConfirmed = (r) => { const s = String(r?.status || ''); return s.includes('confirmed') || s.includes('auto by handle'); };
      if (filterMode === 'no_match') rows = list.filter(isNoMatch);
      else if (filterMode === 'needs_review') rows = list.filter(isNeedsReview);
      else if (filterMode === 'confirmed') rows = list.filter(isConfirmed);
      else rows = list;

      idx = Math.min(idx, Math.max(0, rows.length - 1));
      manualPick = null;
      selectedShopifyId = null;
      selectedRowSuggestionIndex = null;
      render();
    }

    function setFilter(mode) {
      filterMode = mode;
      document.getElementById('filter-no-match').classList.toggle('primary', mode === 'no_match');
      document.getElementById('filter-needs-review').classList.toggle('primary', mode === 'needs_review');
      document.getElementById('filter-confirmed').classList.toggle('primary', mode === 'confirmed');
      document.getElementById('filter-all').classList.toggle('primary', mode === 'all');
      applyFilter();
    }

    function priceDiffLabel(supPrice, shopPrice) {
      if (supPrice == null || shopPrice == null) return '';
      const d = shopPrice - supPrice;
      const pct = supPrice !== 0 ? ((d / supPrice) * 100).toFixed(1) : '—';
      const cls = Math.abs(Number(pct)) > 15 ? 'warn' : 'ok';
      return `<div class="price-diff ${cls}">Δ price: ${d > 0 ? '+' : ''}${d.toFixed(2)} (${pct}% vs supplier)</div>`;
    }

    function shouldHideScoreLine(m) {
      const score = Number(m?.score);
      const reason = String(m?.reason || '').trim().toLowerCase();
      // For already-confirmed matches, the score/reason is noisy.
      return score === 100 && (reason === 'saved_mapping' || reason === 'exact_handle');
    }

    function productStatusBadge(m) {
      const st = String(m?.product_status || m?.raw?.['Product Status'] || '').trim().toUpperCase();
      if (!st || st === '—') return '';
      const cls = st === 'ACTIVE' ? 'ps-active' : st === 'DRAFT' ? 'ps-draft' : '';
      return `<span class="ps-badge ${cls}">${escapeHtml(st)}</span>`;
    }

    function render() {
      const r = rows[idx];
      if (!r) {
        document.getElementById('idx-label').textContent = rowsAll?.length
          ? `No results for filter`
          : 'No results';
        const hdrMeta = document.getElementById('hdr-meta');
        if (hdrMeta) hdrMeta.textContent = `${rowsAll?.length || 0} supplier rows (caviar/seafood filter)`;
        document.getElementById('status-bar').innerHTML = '';
        document.getElementById('supplier-card-status').innerHTML = '';
        document.getElementById('supplier-block').innerHTML = `<p class="meta">—</p>`;
        document.getElementById('matches-block').innerHTML = `<p class="meta">—</p>`;
        return;
      }
      const s = r.supplier;
      document.getElementById('idx-label').textContent = `Product ${idx + 1} / ${rows.length}`;
      const suffix =
        filterMode === 'no_match'
          ? ' · filter: no match'
          : filterMode === 'needs_review'
            ? ' · filter: needs review'
          : filterMode === 'confirmed'
            ? ' · filter: confirmed'
            : '';
      const hdrMeta = document.getElementById('hdr-meta');
      if (hdrMeta) hdrMeta.textContent = `${rowsAll?.length || rows.length} supplier rows (caviar/seafood filter)${suffix}`;

      document.getElementById('status-bar').innerHTML = '';
      document.getElementById('supplier-card-status').innerHTML =
        `<span class="status-badge ${badgeClass(r.status)}">${escapeHtml(r.status)}</span>`;

      document.getElementById('supplier-block').innerHTML = `
        ${s.image ? `<img class="supplier-img" src="${escapeAttr(s.image)}" alt="" />` : '<p class="meta">No image</p>'}
        <div class="line"><strong>Name</strong> ${escapeHtml(s.name_en || s.name || '')}</div>
        <div class="line"><strong>Handle</strong> ${escapeHtml(s.handle)}</div>
        ${
          (!Array.isArray(s.raw?.variants) || s.raw.variants.length === 0)
            ? `<div class="line"><strong>Weight</strong> ${escapeHtml(parseWeightFromText(s.name_en || s.name || s.handle || '') || '—')}</div>
               <div class="line"><strong>Price</strong> ${escapeHtml(formatPriceMaybeAED(s.promotional_price ?? s.regular_price))}</div>`
            : ''
        }
        ${renderVariantsTable({ title: 'Supplier variants', variants: s.raw?.variants || [], kind: 'supplier', limit: 6 })}
      `;

      const mb = document.getElementById('matches-block');
      const parts = [];

      if (manualPick) {
        const m = manualPick;
        const scoreLabel =
          m.score != null && m.score !== '' && m.score !== '—'
            ? `${escapeHtml(String(m.score))}%`
            : '—';
        const scoreHtml = shouldHideScoreLine(m)
          ? ''
          : `<div class="score">Score: ${scoreLabel} ${m.reason ? '· ' + escapeHtml(m.reason) : ''}</div>`;
        parts.push(`
          <div class="match-card selected" data-i="manual" data-gid="${escapeAttr(m.shopify_product_id || '')}" onclick="selectMatch(this)">
            <div class="line" style="color:var(--accent);font-size:0.8rem;margin-bottom:8px;">Manual search — click Confirm when ready</div>
            ${m.image ? `<img class="match-img" src="${escapeAttr(m.image)}" alt="" />` : ''}
            <div class="line"><strong>Name</strong> ${escapeHtml(m.name_ru || m.name || '')} ${productStatusBadge(m)}</div>
            <div class="line"><strong>Handle</strong> ${escapeHtml(m.handle)}</div>
            ${
              (!Array.isArray(m.raw?.variants) || m.raw.variants.length === 0)
                ? `<div class="line"><strong>Weight</strong> ${escapeHtml(parseWeightFromText(m.name_ru || m.name || m.handle || '') || '—')}</div>
                   <div class="line"><strong>Price</strong> ${escapeHtml(formatPriceMaybeAED(m.price))}</div>`
                : ''
            }
            ${scoreHtml}
            ${renderVariantsTable({
              title: 'Gastronom variants',
              variants: m.raw?.variants || [],
              kind: 'gastronom',
              limit: 6,
              supplierVariants: s.raw?.variants || []
            })}
            ${gastronomCardSyncRowHtml(m.shopify_product_id)}
          </div>
        `);
        selectedShopifyId = m.shopify_product_id || null;
        selectedRowSuggestionIndex = 'manual';
      } else {
        selectedShopifyId = null;
        selectedRowSuggestionIndex = null;
      }

      const showOnlyConfirmedCard = filterMode === 'confirmed';
      const suggestionsToRender = showOnlyConfirmedCard
        ? [r.suggestions.find((x) => x != null)].filter(Boolean)
        : r.suggestions;

      parts.push(
        ...suggestionsToRender.map((m, i) => {
          if (!m) return `<div class="match-card muted">—</div>`;
          const scoreHtml = shouldHideScoreLine(m)
            ? ''
            : `<div class="score">Score: ${m.score != null ? escapeHtml(String(m.score)) : '—'}% ${m.reason ? '· ' + escapeHtml(m.reason) : ''}</div>`;
          return `
          <div class="match-card" data-i="${i}" data-gid="${escapeAttr(m.shopify_product_id || '')}" onclick="selectMatch(this)">
            ${m.image ? `<img class="match-img" src="${escapeAttr(m.image)}" alt="" />` : ''}
            <div class="line"><strong>Name</strong> ${escapeHtml(m.name_ru || m.name || '')} ${productStatusBadge(m)}</div>
            <div class="line"><strong>Handle</strong> ${escapeHtml(m.handle)}</div>
            ${
              (!Array.isArray(m.raw?.variants) || m.raw.variants.length === 0)
                ? `<div class="line"><strong>Weight</strong> ${escapeHtml(parseWeightFromText(m.name_ru || m.name || m.handle || '') || '—')}</div>
                   <div class="line"><strong>Price</strong> ${escapeHtml(formatPriceMaybeAED(m.price))}</div>`
                : ''
            }
            ${scoreHtml}
            ${renderVariantsTable({
              title: 'Gastronom variants',
              variants: m.raw?.variants || [],
              kind: 'gastronom',
              limit: 6,
              supplierVariants: s.raw?.variants || []
            })}
            ${gastronomCardSyncRowHtml(m.shopify_product_id)}
          </div>
        `;
        })
      );
      mb.innerHTML = parts.join('');
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t == null ? '' : String(t);
      return d.innerHTML;
    }
    function escapeAttr(t) {
      return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    }
    function parseWeightFromText(text) {
      const t = String(text || '');
      const m = t.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|кг|г)\b/i);
      if (!m) return null;
      const n = String(m[1]).replace(',', '.');
      const u = String(m[2] || '').toLowerCase();
      const unit = u === 'kg' || u === 'кг' ? 'kg' : 'g';
      return `${n} ${unit}`;
    }
    function formatPriceMaybeAED(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '—';
      return `${n.toFixed(2)} AED`;
    }
    /** gid://shopify/Product/8862819123369 → 8862819123369 */
    function shopifyNumericProductId(gid) {
      const m = String(gid || '').match(/Product\/(\d+)/);
      return m ? m[1] : String(gid || '');
    }

    function normalizeQtySupplier(v) {
      const out = Boolean(v?.out_of_stock) || v?.available === false;
      if (out) return { label: 'out of stock', cls: 'bad' };
      if (v?.unlimited_stock) return { label: 'unlimited', cls: 'ok' };
      const q = v?.qty;
      if (q != null && String(q).trim() !== '') return { label: `limited (${q})`, cls: 'warn' };
      if (v?.limited_stock) return { label: 'limited', cls: 'warn' };
      return { label: '—', cls: '' };
    }

    function normalizeQtyGastronom(v) {
      const raw = v?.stock;
      const policy = String(v?.inventory_policy || v?.inventoryPolicy || '').trim().toUpperCase();
      const unlimited = policy === 'CONTINUE';
      if (raw == null || String(raw).trim() === '') {
        return { label: '—', cls: '', unlimited };
      }
      const n = Number(String(raw).replace(/[^0-9\\-]+/g, ''));
      if (!Number.isFinite(n)) return { label: String(raw), cls: '', unlimited };
      const cls = n <= 0 ? 'bad' : 'warn';
      return { label: String(n), cls, unlimited };
    }

    function weightGrams(v) {
      const w = v?.weight != null ? v.weight : v?.title;
      const m = String(w == null ? '' : w).match(/(-?\d+)/);
      if (!m) return null;
      const n = Number(m[1]);
      return Number.isFinite(n) ? n : null;
    }

    function supplierQtyNumber(v) {
      const out = Boolean(v?.out_of_stock) || v?.available === false;
      if (out) return 0;
      if (v?.unlimited_stock) return null;
      const q = v?.qty;
      if (q == null || String(q).trim() === '') return null;
      const n = Number(String(q).replace(/[^0-9\\-]+/g, ''));
      if (!Number.isFinite(n)) return null;
      return Number.isInteger(n) ? n : Math.trunc(n);
    }

    async function setVariantQtyInShopify(variantGid, qty, btn) {
      if (!variantGid) return;
      const prevText = btn ? btn.textContent : '';

          btn.textContent = 'Updating…';
        }
        const res = await fetch(API + '/api/inventory/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ variant_id: variantGid, quantity: qty })
        });
        const text = await res.text();
        if (!res.ok) throw new Error(text || `HTTP ${res.status}`);
        let j = null;
        try {
          j = JSON.parse(text);
        } catch (_) {
          // ignore
        }
        if (!j?.ok) throw new Error(j?.error || text || 'Failed');
        await load();
      } catch (e) {
        showInventoryFlash(`Inventory: ${String(e.message || e)}`, true);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = prevText || 'Set qty';
        }
      }
    }

    function gastronomCardSyncRowHtml(shopifyProductGid) {
      const g = String(shopifyProductGid || '').trim();
      if (!g) return '';
      return `<div class="card-sync-row" style="margin-top:12px;">
    <button type="button" class="primary" style="font-size:0.85rem;padding:6px 12px;" title="Align this product&#39;s variants with the supplier row on the left (Shopify Admin)." onclick="event.stopPropagation(); syncVariantsFromSupplierForProduct('${escapeAttr(g)}', this)">↻ Sync variants → Shopify</button>
  </div>`;
    }

    /** Patch current report row in memory from live Shopify (no full report reload, no from_gastronom.json write). */
    async function refreshGastronomRowFromShopify(shopifyProductGid) {
      const gid = String(shopifyProductGid || '').trim();
      const res = await fetch(
        API + '/api/gastronom-product-live?shopify_product_id=' + encodeURIComponent(gid)
      );
      const text = await res.text();
      let j = null;
      try {
        j = JSON.parse(text);
      } catch (_) {
        // ignore
      }
      if (!res.ok || !j?.ok || !j.row) throw new Error(j?.error || text || 'Live refresh failed');
      const newRow = j.row;
      const cur = rows[idx];
      if (!cur) return;
      for (let i = 0; i < cur.suggestions.length; i++) {
        const s = cur.suggestions[i];
        if (s && s.shopify_product_id === gid) {
          cur.suggestions[i] = {
            ...newRow,
            score: s.score,
            reason: s.reason
          };
          break;
        }
      }
      if (manualPick && manualPick.shopify_product_id === gid) {
        manualPick = {
          ...newRow,
          score: manualPick.score,
          reason: manualPick.reason
        };
      }
    }

    /**
     * Full supplier → Shopify alignment (prices, policies, qty, add missing weights, orphans → 0 / DENY).
     * Uses staged Output/products_all.json for the current supplier row.
     */
    async function syncVariantsFromSupplierForProduct(shopifyProductGid, btn) {
      const r = rows[idx];
      const gid = String(shopifyProductGid || '').trim();
      if (!r || !gid) {
        showInventoryFlash('Pick a supplier row and a Gastronom product (with GID).', true);
        return;
      }
      const defaultLabel = '↻ Sync variants → Shopify';
      const prevText = btn ? btn.textContent : defaultLabel;
      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Syncing…';
        }
        const res = await fetch(API + '/api/variants/sync-from-supplier', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source_handle: r.supplier.handle,
            shopify_product_id: gid,
            supplier_mode: MODE === 'ubazar' ? 'ubazar' : 'caviar'
          })
        });
        const text = await res.text();
        let j = null;
        try {
          j = JSON.parse(text);
        } catch (_) {
          // ignore
        }
        if (!res.ok || !j?.ok) throw new Error(j?.error || text || 'Failed');
        const a = j.applied || {};
        const refreshedGid = String(j.shopify_product_id || gid).trim();
        const activeNote = j.set_active_after_sync
          ? ' Product set to ACTIVE (was DRAFT; at least one variant is sellable).'
          : '';
        showInventoryFlash(
          `Shopify updated: ${a.bulk_update_rows ?? 0} variant row(s), ${a.inventory_rows ?? 0} inventory row(s), ${a.option_values_added ?? 0} new option value(s), reordered ${a.reorder_moved_rows ?? 0} row(s). Card refreshed from live Shopify.${activeNote}`,
          false
        );
        try {
          if (MODE === 'ubazar') {
            // UBazar cards use handle as identifier; patch visible card from sync "after" result.
            const after = j.after || null;
            const cur = rows[idx];
            const targetHandle = String(gid || '').trim(); // in ubazar mode gid == handle
            const patchCard = (obj) => {
              if (!obj) return;
              obj.product_status = after?.product_status || obj.product_status || null;
              if (after?.price != null) obj.price = after.price;
              if (after?.inventory_policy) obj.inventory_policy = after.inventory_policy;
              if (after?.inventory_quantity != null) obj.inventory_quantity = after.inventory_quantity;
            };
            if (manualPick && String(manualPick.handle || '').trim() === targetHandle) patchCard(manualPick);
            if (cur && Array.isArray(cur.suggestions)) {
              const hit = cur.suggestions.find((x) => String(x?.handle || '').trim() === targetHandle) || null;
              patchCard(hit);
            }
            render();
          } else {
            await refreshGastronomRowFromShopify(refreshedGid);
            render();
          }
        } catch (re) {
          showInventoryFlash(
            `Synced OK; card refresh failed: ${String(re.message || re)}. Run npm run sync:gastronom or reload the page.`,
            true
          );
          await load();
        }
      } catch (e) {
        showInventoryFlash(`Variant sync: ${String(e.message || e)}`, true);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = prevText || defaultLabel;
        }
      }
    }

    async function syncVariantsFromSupplier(btn) {
      if (!selectedShopifyId) {
        showInventoryFlash('Select a Gastronom card first, or use the sync button on that card.', true);
        return;
      }
      await syncVariantsFromSupplierForProduct(selectedShopifyId, btn);
    }

    function renderVariantsTable(opts) {
      const { title, variants, kind, limit, supplierVariants } = opts || {};
      const arr = Array.isArray(variants) ? variants : [];
      if (arr.length === 0) return '';
      const rows = arr.slice(0, Math.max(1, limit || arr.length));
      const more =
        arr.length > rows.length
          ? `<div class="meta" style="margin-top:6px;">+${arr.length - rows.length} more variant(s)</div>`
          : '';
      const toQty = kind === 'supplier' ? normalizeQtySupplier : normalizeQtyGastronom;
      const priceFmt =
        kind === 'supplier'
          ? (v) =>
              v?.promotional_price != null
                ? String(v.promotional_price)
                : v?.regular_price != null
                  ? String(v.regular_price)
                  : '—'
          : (v) => (v?.price != null ? `${String(v.price)} AED` : '—');
      const weightFmt =
        kind === 'supplier'
          ? (v) => (v?.weight != null && String(v.weight).trim() !== '' ? `${String(v.weight)} g` : '—')
          : (v) => (v?.weight != null && String(v.weight).trim() !== '' ? String(v.weight) : '—');

      return `
        <div class="variants">
          <div class="vtitle">${escapeHtml(title || 'Variants')}</div>
          <table>
            <thead>
              <tr>
                <th>Weight</th>
                <th>Price</th>
                <th>Qty</th>
                ${kind === 'gastronom' ? '<th></th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${rows
                .map((v) => {
                  const q = toQty(v);
                  const qtyHtml =
                    kind === 'gastronom'
                      ? `<span class="qty-pill ${escapeAttr(q.cls)}">${escapeHtml(q.label)}</span>` +
                        (q.unlimited ? ` <span class="qty-pill ok">Unlimited</span>` : '')
                      : `<span class="qty-pill ${escapeAttr(q.cls)}">${escapeHtml(q.label)}</span>`;
                  let actionTd = '';
                  if (kind === 'gastronom') {
                    const vg = v?.shopify_variant_id || v?.id || null;
                    const supArr = Array.isArray(supplierVariants) ? supplierVariants : [];
                    const gw = weightGrams(v);
                    const match = gw == null ? null : supArr.find((sv) => weightGrams(sv) === gw) || null;
                    const supQty = match ? supplierQtyNumber(match) : null;
                    const supUnlimited = Boolean(match?.unlimited_stock);
                    const gUnlimited = q.unlimited;
                    const btns = [];
                    if (vg && match) {
                      if (supQty != null && supQty >= 0) {
                        btns.push(
                          `<button class="qty-btn" type="button" onclick="setVariantQtyInShopify('${escapeAttr(
                            String(vg)
                          )}', ${supQty}, this)">Set = ${supQty}</button>`
                        );
                      } else if (supUnlimited && !gUnlimited) {
                        btns.push(
                          `<button class="qty-btn" type="button" onclick="setVariantUnlimitedInShopify('${escapeAttr(
                            String(vg)
                          )}', this)">Set unlimited</button>`
                        );
                      }
                    }
                    actionTd = `<td class="meta" style="white-space:normal;">${btns.join(' ')}</td>`;
                  }
                  return `<tr>
                    <td>${escapeHtml(weightFmt(v))}</td>
                    <td>${escapeHtml(priceFmt(v))}</td>
                    <td>${qtyHtml}</td>
                    ${kind === 'gastronom' ? actionTd : ''}
                  </tr>`;
                })
                .join('')}
            </tbody>
          </table>
          ${more}
        </div>
      `;
    }

    function selectMatch(el) {
      if (el.dataset.i !== 'manual') {
        manualPick = null;
      }
      document.querySelectorAll('.match-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedRowSuggestionIndex = el.dataset.i === 'manual' ? 'manual' : Number(el.dataset.i);
      selectedShopifyId = el.dataset.gid || null;
    }

    /**
     * @param {{ advance?: boolean, reset?: boolean }} opts
     * advance: after confirm/no-match → next product. reset: force index 0 (not used by default).
     */
    async function load(opts = {}) {
      const prevIdx = idx;
      const advance = opts.advance === true;
      const reset = opts.reset === true;
      const bar = document.getElementById('status-bar');
      try {
        const res = await fetch(API + ENDPOINTS.report);
        const raw = await res.text();
        if (!res.ok) {
          bar.innerHTML = `<span class="status-badge st-none">Report failed (${res.status}). Is the review server running? Open <code>http://localhost:${REVIEW_PORT}</code> from the same machine. ${escapeHtml(raw.slice(0, 280))}</span>`;
          rowsAll = [];
          rows = [];
          return;
        }
        let data;
        try {
          data = JSON.parse(raw);
        } catch (parseErr) {
          bar.innerHTML = `<span class="status-badge st-none">Bad JSON from ${escapeHtml(ENDPOINTS.report)}. ${escapeHtml(String(parseErr.message))}</span>`;
          rowsAll = [];
          rows = [];
          return;
        }
        rowsAll = data.rows || [];
        const mapWarn = document.getElementById('mapping-warn');
        const audit = data.mappingAudit;
        if (audit && audit.warning_all_same_gid) {
          mapWarn.style.display = 'block';
          mapWarn.innerHTML =
            '<strong>Mapping looks corrupted:</strong> every confirmed supplier handle in this list points to the ' +
            'same Shopify product (<code>' +
            escapeHtml(String(audit.duplicate_gid_groups[0]?.shopify_product_id || '')) +
            '</code>). ' +
            'That breaks matching and the “unpaired Gastronom” count. ' +
            'Restore <code>Output/product_mapping.json</code> from backup or git, or clear bad entries and re-confirm each product.';
        } else if (audit && audit.duplicate_gid_groups && audit.duplicate_gid_groups.length > 0) {
          mapWarn.style.display = 'block';
          mapWarn.innerHTML =
            '<strong>Duplicate GIDs in mapping:</strong> ' +
            audit.duplicate_gid_groups.length +
            ' Shopify product ID(s) are shared by multiple supplier handles. ' +
            'Check <code>Output/product_mapping.json</code> — each handle should usually map to its own product GID.';
        } else {
          mapWarn.style.display = 'none';
          mapWarn.innerHTML = '';
        }

        // keep index stable relative to previous filtered list
        const maxAll = Math.max(0, rowsAll.length - 1);
        if (reset) {
          idx = 0;
        } else if (advance) {
          idx = Math.min(prevIdx + 1, maxAll);
        } else {
          idx = Math.min(prevIdx, maxAll);
        }
        setFilter(filterMode);
      } catch (e) {
        bar.innerHTML = `<span class="status-badge st-none">Cannot reach API at ${escapeHtml(API || '(same origin)')}/api/report — ${escapeHtml(String(e.message))}. Run <code>npm run review</code> in the project folder.</span>`;
        rowsAll = [];
        rows = [];
      }
    }

    function prev() {
      if (idx > 0) {
        manualPick = null;
        idx--;
        render();
      }
    }
    function next() {
      if (idx < rows.length - 1) {
        manualPick = null;
        idx++;
        render();
      }
    }

    async function confirmSelected() {
      const r = rows[idx];
      if (!r || !selectedShopifyId) {
        alert('Select a Gastronom card first (click a suggestion).');
        return;
      }
      const payload = MODE === 'ubazar'
        ? { source_handle: r.supplier.handle, gastronom_handle: selectedShopifyId }
        : { source_handle: r.supplier.handle, shopify_product_id: selectedShopifyId };
      const res = await fetch(API + ENDPOINTS.confirm, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) { alert(await res.text()); return; }
      manualPick = null;
      // In UBazar mode we avoid auto-advance to reduce accidental mismatches.
      await load({ advance: MODE !== 'ubazar' });
    }

    async function markNoMatch() {
      const r = rows[idx];
      if (!r) return;
      if (MODE === 'ubazar' && String(r.status || '').includes('confirmed')) {
        // In UBazar mode, "No match" on a confirmed row should clear a wrong mapping (not permanently no-match it).
        const res = await fetch(API + '/api/ubazar/clear-match', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source_handle: r.supplier.handle })
        });
        if (!res.ok) { alert(await res.text()); return; }
      } else {
        await fetch(API + ENDPOINTS.noMatch, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source_handle: r.supplier.handle })
        });
      }
      manualPick = null;
      await load({ advance: MODE !== 'ubazar' });
    }

    function downloadCsv() {
      window.open(API + '/api/report.csv', '_blank');
    }

    function statusBadgeClass(st) {
      const u = String(st || '').trim().toUpperCase();
      if (u === 'ACTIVE') return 'st-active';
      if (u === 'DRAFT') return 'st-draft';
      return 'st-other';
    }

    function unpairedStatusOrder(st) {
      const u = String(st || '').trim().toUpperCase();
      if (u === 'ACTIVE') return 0;
      if (u === 'DRAFT') return 1;
      return 2;
    }

    async function draftAllUnpairedActive(btn) {
      if (lastUnpairedActiveCount <= 0) return;
      const ok = confirm(
        `Set ${lastUnpairedActiveCount} ACTIVE unpaired Gastronom product(s) to DRAFT in Shopify? They will stop selling on channels until set back to ACTIVE.`
      );

        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Drafting…';
        }
        const endpoint = MODE === 'ubazar' ? '/api/ubazar/unpaired-gastronom/draft-active' : '/api/unpaired-gastronom/draft-active';
        const res = await fetch(API + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}'
        });
        const text = await res.text();
        let j = null;
        try {
          j = JSON.parse(text);
        } catch (_) {
          // ignore
        }

    async function showUnpairedGastronom() {
      const box = document.getElementById('unpaired-grid');
      const sum = document.getElementById('unpaired-summary');
      const actions = document.getElementById('unpaired-actions');
      lastUnpairedActiveCount = 0;
      if (actions) actions.style.display = 'none';
      box.innerHTML = '<p class="meta">Loading…</p>';
      sum.textContent = '';
      document.getElementById('unpaired-modal').classList.add('open');
      try {
        const res = await fetch(API + (MODE === 'ubazar' ? '/api/ubazar/unpaired-gastronom' : '/api/unpaired-gastronom'));
        if (res.status === 404) {
          throw new Error(
            'Route missing — restart npm run review from the project folder. Open http://localhost:' +
              REVIEW_PORT +
              ' .'
          );
        }
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        if (MODE === 'ubazar') {
          sum.innerHTML =
            `Gastronom rows (Uzbek collection): <strong>${data.gastronom_count ?? 0}</strong> · ` +
            `Unpaired: <strong>${data.count ?? 0}</strong> (ACTIVE <strong>${data.active ?? 0}</strong>, DRAFT <strong>${data.draft ?? 0}</strong>).`;
          lastUnpairedActiveCount = Number(data.active) || 0;
          if (actions) actions.style.display = lastUnpairedActiveCount > 0 ? 'flex' : 'none';
        } else {
          sum.innerHTML =
            (data.unpaired_gastronom_scope === 'full_products_all'
              ? `Supplier rows (full <code>products_all</code> — set by env): <strong>${data.supplier_product_count}</strong> · `
              : `Supplier rows (caviar/seafood, same as main list): <strong>${data.supplier_product_count}</strong> · `) +
            `Unpaired Gastronom rows: <strong>${data.count}</strong> ` +
            `(ACTIVE <strong>${data.active}</strong>, DRAFT <strong>${data.draft}</strong>). ` +
            `Not linked = no shared handle with those supplier rows and no confirmed mapping from them. ` +
            (data.unpaired_gastronom_scope !== 'full_products_all'
              ? '<span style="font-size:0.8rem;">Tip: use env <code>UNPAIRED_GASTRONOM_FULL_SUPPLIER=1</code> to compare against all supplier URLs (legacy).</span>'
              : '');

          if (actions) actions.style.display = lastUnpairedActiveCount > 0 ? 'flex' : 'none';
        }
        const list = [...(data.products || [])].sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ru'));
        box.innerHTML = list
          .map(
            (p) => `
          <div class="unpaired-card">
            ${p.image ? `<img src="${escapeAttr(p.image)}" alt="" loading="lazy" />` : '<div class="meta" style="padding:24px;text-align:center;">No image</div>'}
            <span class="status-badge ${statusBadgeClass(p.status)}">${escapeHtml(p.status)}</span>
            <div class="title">${escapeHtml(p.name)}</div>
            <div class="handle">${escapeHtml(p.handle)}</div>
            ${p.shopify_product_id ? `<div class="handle" style="font-size:0.72rem;">${escapeHtml(shopifyNumericProductId(p.shopify_product_id))}</div>` : ''}
          </div>
        `
          )
          .join('');
      } catch (e) {
        box.innerHTML = `<p class="meta" style="color:var(--bad);">${escapeHtml(String(e.message))}</p>`;

    async function showUnpairedSupplier() {

      box.innerHTML = '<p class="meta">Loading…</p>';

        const res = await fetch(API + (MODE === 'ubazar' ? '/api/ubazar/unpaired-supplier' : '/api/unpaired-supplier'));
        if (res.status === 404) {
          throw new Error(
            'Route missing — restart npm run review from the project folder (needs /api/unpaired-supplier).'
          );
        }
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        sum.innerHTML = MODE === 'ubazar'
          ? ('UBazar rows: <strong>' + (data.supplier_product_count ?? 0) + '</strong> · ' +
            'Not linked: <strong>' + (data.count ?? 0) + '</strong> ' +
            '(Needs review <strong>' + (data.counts?.needs_review ?? 0) + '</strong>, No match <strong>' + (data.counts?.no_match ?? 0) + '</strong>).')
          : ('In-scope supplier rows (caviar/seafood filter): <strong>' +
            data.supplier_product_count +
            '</strong> · ' +
            'Not in Gastronom export (no shared handle, no mapping to a GID in from_gastronom.json): <strong>' +
            data.count +
            '</strong>. ' +
            'Click an image to open the product on 1-caviar.ae in a new tab.');
        const list = data.products || [];
        box.innerHTML = list
          .map((p) => {
            const href = escapeAttr(p.url || '');

                escapeAttr(p.image) +
                '" alt="" loading="lazy" /></a>'

                href +
                '" target="_blank" rel="noopener noreferrer">Open product on 1-caviar.ae →</a>';
            return (
              '<div class="unpaired-card">' +
              imgHtml +
              (MODE === 'ubazar' && p.status ? '<span class="status-badge ' + (String(p.status).includes('NO MATCH') ? 'st-none' : 'st-review') + '">' + escapeHtml(p.status) + '</span>' : '') +
              '<div class="title">' +
              escapeHtml(p.name) +
              '</div>' +
              '<div class="handle">' +
              escapeHtml(p.handle) +
              '</div>' +
              (p.price != null
                ? '<div class="handle">Price: ' + escapeHtml(String(p.price)) + '</div>'

        box.innerHTML =
          '<p class="meta" style="color:var(--bad);">' + escapeHtml(String(e.message)) + '</p>';

    function closeSupplierUnpaired() {
      document.getElementById('supplier-unpaired-modal').classList.remove('open');
    }

    function closeUnpaired() {
      document.getElementById('unpaired-modal').classList.remove('open');
    }

    async function fetchGastronomFromShopify(btn) {
      const el = btn || document.getElementById('btn-sync-gastronom');
      const prev = el ? el.textContent : '';
      try {
        if (el) {
          el.disabled = true;
          el.textContent = 'Fetching…';
        }
        const res = await fetch(API + '/api/sync-gastronom', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const text = await res.text();
        let j = null;
        try {
          j = JSON.parse(text);
        } catch (_) {}
        if (!res.ok) {
          if (/cannot post/i.test(text) || /<!DOCTYPE/i.test(text)) {
            throw new Error(
              `API not on this server (got HTML ${res.status}). Open the app at http://localhost:${REVIEW_PORT}/ and restart npm run review so POST /api/sync-gastronom is registered.`
            );
          }
          throw new Error(j?.error || text.slice(0, 400) || res.statusText);
        }
        if (!j?.ok) throw new Error(j?.error || 'Sync failed');
        const d = j.delta_counts || {};
        showInventoryFlash(
          `Gastronom: refreshed ${j.products} products from Shopify (+${d.added ?? 0} / ~${d.updated ?? 0} / −${d.removed ?? 0}).`,
          false
        );
        await load();
      } catch (e) {
        showInventoryFlash(`Fetch Gastronom: ${String(e.message || e)}`, true);
      } finally {
        if (el) {
          el.disabled = false;
          el.textContent = prev || 'Fetch Gastronom from Shopify';
        }
      }
    }

    async function runDailyAutomation(btn) {
      const el = btn || document.getElementById('btn-run-automation');
      const prev = el ? el.textContent : '';
      const ok = confirm(
        'Run daily automation now?\n\nThis will:\n- Fetch Gastronom from Shopify\n- Scan supplier (1-caviar) and publish latest to dashboard\n- Draft all ACTIVE unpaired Gastronom products\n- Sync variants for mapped products that changed in supplier delta'
      );
      if (!ok) return;
      try {
        if (el) {
          el.disabled = true;
          el.textContent = 'Running…';
        }
        const res = await fetch(API + '/api/automation/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}'
        });
        const text = await res.text();
        let j = null;
        try {
          j = JSON.parse(text);
        } catch (_) {}
        if (!res.ok) throw new Error(j?.error || text.slice(0, 500) || res.statusText);
        if (!j?.ok) throw new Error((j?.errors || []).join(' | ') || 'Automation failed');
        const c = j.counts || {};
        showInventoryFlash(
          `Automation OK. Drafted: ${c.drafted_unpaired_active ?? 0} (failed ${c.drafted_failures ?? 0}). Variant sync OK: ${c.variant_sync_ok ?? 0} (failed ${c.variant_sync_failed ?? 0}). Supplier updated: ${c.supplier_delta_updated ?? 0}.`,
          false
        );
        await load();
        await loadLastAutomationReport(j);
      } catch (e) {
        showInventoryFlash(`Automation: ${String(e.message || e)}`, true);
      } finally {
        if (el) {
          el.disabled = false;
          el.textContent = prev || 'Run daily automation';
        }
      }
    }

    async function runUbazarPipeline(btn) {
      const el = btn || document.getElementById('btn-unpaired-supplier');
      const prev = el ? el.textContent : '';
      try {
        if (el) {

          el.textContent = 'Running…';
        }
        const res = await fetch(API + '/api/ubazar/run', {

        });

        try {

        await load();

      } catch (e) {

      } finally {
        if (el) {

          el.textContent = prev || 'Run UBazar pipeline';
        }
      }
    }

    async function loadLastAutomationReport(prefetchedJson) {
      try {
        const modal = document.getElementById('automation-modal');
        const pre = document.getElementById('automation-log');
        if (!modal || !pre) return;
        modal.classList.add('open');

        let text = '';
        if (prefetchedJson) {
          text = MODE === 'ubazar' ? formatUbazarAutomationReport(prefetchedJson) : formatAutomationReport(prefetchedJson);
        } else {
          if (MODE === 'ubazar') {
            const res = await fetch(API + '/api/ubazar/automation/last-run');
            const raw = await res.text();
            if (!res.ok) throw new Error(raw || 'Failed to load UBazar automation report');
            try { text = formatUbazarAutomationReport(JSON.parse(raw)); } catch (_) { text = raw; }
          } else {
            const res = await fetch(API + '/api/automation/last-run.txt');
            text = await res.text();
            if (!res.ok) throw new Error(text || 'Failed to load automation report');
          }
        }
        pre.textContent = text;
      } catch (e) {
        showInventoryFlash(`Automation report: ${String(e.message || e)}`, true);
      }
    }

    function formatUbazarAutomationReport(j) {
      const c = j?.counts || {};
      const findStep = (name) =>
        (Array.isArray(j?.steps) ? j.steps : []).find((s) => s && s.step === name) || null;
      const delta = findStep('supplier_delta');
      const syncStep = findStep('sync_mapped_products');
      const lines = [];
      lines.push('UBazar automation run');
      lines.push(`Started:  ${j.started_at || '—'}`);
      lines.push(`Finished: ${j.finished_at || '—'}`);
      lines.push(`Result:   ${j.ok ? 'OK' : 'FAILED'}`);
      lines.push('');
      lines.push('Summary');
      lines.push(`- UBazar catalog: ${c.ubazar_latest_products ?? 0} products scraped.`);
      lines.push(`- Supplier delta vs previous snapshot: +${c.supplier_delta_added ?? 0} added, ~${c.supplier_delta_updated ?? 0} updated, -${c.supplier_delta_removed ?? 0} removed.`);
      lines.push(`- Unpaired Gastronom products set to DRAFT: ${c.drafted_unpaired_gastronom ?? 0} (failed ${c.drafted_unpaired_failed ?? 0}).`);
      lines.push(`- Mapped products activated (UBazar present): ${c.mapped_activated ?? 0}.`);
      lines.push(`- Mapped products set to DRAFT (UBazar missing/unavailable): ${c.mapped_drafted ?? 0}.`);
      lines.push(`- Variant sync (price + unlimited): OK ${c.variant_sync_ok ?? 0}, failed ${c.variant_sync_failed ?? 0}.`);
      const synced = Array.isArray(syncStep?.synced) ? syncStep.synced : [];
      if (synced.length) {
        lines.push('');
        lines.push('Synced products');
        for (const s of synced) {
          const after = s.after || {};
          lines.push(`  ${s.source_handle} -> ${s.gastronom_handle}: status=${after.status ?? '?'} price=${after.price ?? '?'} policy=${after.inventoryPolicy ?? '?'}`);
        }
      }
      const errs = j?.errors || [];
      if (errs.length) {
        lines.push('');
        lines.push('Errors');
        for (const e of errs) lines.push(`  - ${String(e)}`);
      }
      const warns = j?.warnings || [];
      if (warns.length) {
        lines.push('');
        lines.push('Warnings');
        for (const w of warns) lines.push(`  - ${String(w)}`);
      }
      return lines.join('\n');
    }

    function formatAutomationReport(j) {
      const c = j?.counts || {};
      const findStep = (name) =>
        (Array.isArray(j?.steps) ? j.steps : []).find((s) => s && s.step === name) || null;
      const supplierDelta = findStep('supplier_delta');
      const syncStep = findStep('variant_sync_mapped_updates');
      const syncItems = Array.isArray(syncStep?.ok_items) ? syncStep.ok_items : [];
      const totalVariantRowsUpdated = syncItems.reduce(
        (sum, it) => sum + Number(it?.applied?.bulk_update_rows || 0),
        0
      );
      const totalInventoryRowsUpdated = syncItems.reduce(
        (sum, it) => sum + Number(it?.applied?.inventory_rows || 0),
        0
      );
      const lines = [];
      lines.push('Automation run');
      lines.push(`Started: ${j.started_at || '—'}`);
      lines.push(`Finished: ${j.finished_at || '—'}`);
      lines.push(`Result: ${j.ok ? 'OK' : 'FAILED'}`);
      lines.push('');
      lines.push('Summary');
      lines.push(`- Supplier catalog now has ${c.supplier_latest_products ?? 0} products in total.`);
      lines.push(
        `- Supplier changes vs previous snapshot: ${supplierDelta?.counts?.added ?? 0} added, ${
          supplierDelta?.counts?.updated ?? 0
        } updated, ${supplierDelta?.counts?.removed ?? 0} removed.`
      );
      lines.push(
        `- Unpaired Shopify products moved ACTIVE -> DRAFT: ${c.drafted_unpaired_active ?? 0} (failed ${
          c.drafted_failures ?? 0
        }).`
      );
      lines.push(
        `- Mapped products synced to Shopify: ${syncStep?.ok_count ?? 0} successful out of ${
          syncStep?.targets ?? 0
        } target products (failed ${syncStep?.failed_count ?? 0}, skipped ${syncStep?.skipped_count ?? 0}).`
      );
      lines.push(
        `- Total variant rows updated: ${totalVariantRowsUpdated} price/variant updates and ${totalInventoryRowsUpdated} inventory updates.`
      );
      const errs = j?.errors || [];
      if (errs && errs.length) {
        lines.push('');
        lines.push('Errors');
        for (const e of errs) lines.push(`- ${String(e)}`);
      }
      return lines.join('\n');
    }

    function openSearch() {
      document.getElementById('search-modal').classList.add('open');
      document.getElementById('search-input').focus();
    }
    function closeSearch() {
      document.getElementById('search-modal').classList.remove('open');
    }

    document.getElementById('search-input').addEventListener('input', async (e) => {
      const q = e.target.value.trim();
      const box = document.getElementById('search-results');
      if (q.length < 2) { box.innerHTML = ''; lastSearchHits = []; return; }
      const res = await fetch(API + ENDPOINTS.search + '?q=' + encodeURIComponent(q));
      const hits = await res.json();
      lastSearchHits = hits;
      box.innerHTML = hits.map((h, i) => `
        <div class="search-hit" data-idx="${i}" onclick="pickSearchHit(Number(this.dataset.idx))">
          <strong>${escapeHtml(h.name_ru || h.name || '')}</strong><br/>
          <span class="meta">${escapeHtml(h.handle)} · ${escapeHtml(h.shopify_product_id || '')}</span>
        </div>
      `).join('');
    });

    function pickSearchHit(i) {
      const hit = lastSearchHits[i];
      const selectedId = hit?.shopify_product_id || hit?.handle || null;
      if (!hit || !selectedId) return;
      manualPick = {
        ...hit,
        shopify_product_id: selectedId,
        score: '—',
        reason: 'manual_search'
      };
      closeSearch();
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').innerHTML = '';
      lastSearchHits = [];
      render();
    }

    if (MODE === 'ubazar') {
      document.getElementById('hdr-title').textContent = 'UBazar ↔ Gastronom';
      document.getElementById('supplier-panel-title').innerHTML = 'Supplier (UBazar) <span id="supplier-card-status"></span>';
      const b1 = document.getElementById('btn-unpaired-gastronom');
      if (b1) b1.textContent = 'Gastronom: not on supplier';
      const b2 = document.getElementById('btn-unpaired-supplier');
      if (b2) b2.textContent = '1-ubazar: not in Gastronom';
      const b3 = document.getElementById('btn-supplier-delta');
      if (b3) {
        b3.style.display = '';
        b3.textContent = 'Supplier delta';
        b3.onclick = () => { window.open('/api/ubazar/delta', '_blank'); };
      }
      const b4 = document.getElementById('btn-sync-gastronom');
      if (b4) {
        b4.textContent = 'Fetch Gastronom from Shopify';
        b4.title = 'Refresh Gastronom Uzbek collection used for matching suggestions';
        b4.onclick = () => { fetchGastronomUzbek(b4); };
      }
      const b5 = document.getElementById('btn-run-automation');
      if (b5) {
        b5.classList.add('primary');
        b5.textContent = 'Run daily automation';
        b5.title = 'Run UBazar pipeline';
        b5.onclick = () => { runUbazarPipeline(b5); };
      }

      // Modal titles to match UBazar wording.
      const unpairedTitle = document.querySelector('#unpaired-modal h2');
      if (unpairedTitle) unpairedTitle.textContent = 'Gastronom products not paired with supplier';
      const supplierUnpairedTitle = document.querySelector('#supplier-unpaired-modal h2');
      if (supplierUnpairedTitle) supplierUnpairedTitle.textContent = '1-ubazar.ae products not linked to Gastronom';

      // Point automation report links to UBazar endpoints.
      const tableLink = document.getElementById('automation-report-table-link');
      if (tableLink) tableLink.style.display = 'none';
      const jsonLink = document.getElementById('automation-report-json-link');
      if (jsonLink) jsonLink.href = '/api/ubazar/automation/last-run';
    }

    load().catch((e) => {
      document.getElementById('status-bar').innerHTML =
        `<span class="status-badge st-none">${escapeHtml(String(e && e.message ? e.message : e))}</span>`;
    });
  </script>
